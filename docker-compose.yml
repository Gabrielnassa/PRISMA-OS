# Banco de dados local para desenvolvimento. A aplicação e o worker rodam com `npm run dev`.
services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      PRISMA_OWNER_PASSWORD: ${PRISMA_OWNER_PASSWORD:-prisma_owner_dev}
      PRISMA_APP_PASSWORD: ${PRISMA_APP_PASSWORD:-prisma_app_dev}
    ports:
      - "5432:5432"
    volumes:
      - prisma_pg:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  prisma_pg:
